# ChunkKeeper-Meldungen, Deutsch.
#
# Hier kann jeder Text geändert werden, danach /chunkkeeper reload. Wörter in {Klammern} setzt das
# Plugin ein; sie müssen drinbleiben, dürfen aber verschoben werden. {count|Chunk|Chunks} wird zu
# „Chunk“, wenn count 1 ist, sonst zu „Chunks“. Fehlt ein Schlüssel, wird der eingebaute Text verwendet.

general:
  yes-word: "ja"
  no-word: "nein"
  none: "keine"
  unknown-subcommand: "Unbekannter Unterbefehl „{subcommand}“. Siehe /chunkkeeper help."
  no-permission: "Dazu hast du keine Berechtigung."
  usage: "Verwendung: /chunkkeeper {command} {usage}"
  not-a-number: "„{text}“ ist keine ganze Zahl."
  unknown-world: "Die Welt „{world}“ gibt es nicht oder sie ist nicht geladen."
  players-only: "Das können nur Spieler. In der Konsole nimm stattdessen „coords“."
  worldedit-missing: "WorldEdit bzw. FastAsyncWorldEdit ist nicht installiert."
  worldguard-missing: "WorldGuard ist nicht installiert."
  area-too-large: "Der Bereich hat {size} {size|Chunk|Chunks}, mehr als das Limit von {limit} (max-area-chunks in der config.yml)."
  radius-too-large: "Ein Radius von {radius} ist zu groß: max-area-chunks in der config.yml erlaubt {limit} Chunks, also höchstens Radius {largest}."
  negative-radius: "Der Radius muss 0 oder größer sein: 0 ist ein Chunk, 1 sind 3 × 3 Chunks, 2 sind 5 × 5."
  name-missing: "Gib nach --name einen Namen an, z. B. --name halloween."
  invalid-name: "„{name}“ ist kein gültiger Bereichsname. Erlaubt sind bis zu 32 Kleinbuchstaben, Ziffern, - und _."
  use-area-release: "Einen benannten Bereich gibst du mit /chunkkeeper area release <name> frei."
  area-exists: "Es gibt schon einen Bereich „{name}“. Gib ihn erst frei oder wähle einen anderen Namen."
  area-exists-short: "Es gibt schon einen Bereich „{name}“."
  area-exists-other-name: "Es gibt schon einen Bereich „{name}“. Wähle einen anderen Namen."
  area-unknown: "Es gibt keinen Bereich „{name}“. Siehe /chunkkeeper area list."

# Bausteine, die in andere Meldungen eingesetzt werden. Ohne Artikel, weil sie mal nach „aus“
# oder „in“ stehen und mal nach einem Doppelpunkt.
describe:
  chunk: "({x}, {z}) in „{world}“"
  rectangle: "Chunks ({x1}, {z1}) bis ({x2}, {z2}) in „{world}“"
  radius: "Umkreis von {radius} {radius|Chunk|Chunks} um ({x}, {z}) in „{world}“"
  worldedit: "WorldEdit-Auswahl in „{world}“"
  worldguard: "WorldGuard-Region „{region}“ in „{world}“"
  world-singles: "Einzelchunks in „{world}“"
  railway: "Schienenstrecke ab {x}, {y}, {z} in „{world}“"

help:
