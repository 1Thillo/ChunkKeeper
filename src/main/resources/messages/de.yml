# ChunkKeeper-Meldungen, Deutsch.
#
# Hier kann jeder Text geändert werden, danach /chunkkeeper reload. Wörter in {Klammern} setzt das
# Plugin ein; sie müssen drinbleiben, dürfen aber verschoben werden. Fehlt ein Schlüssel, wird der
# eingebaute Text verwendet.

general:
  yes-word: "ja"
  no-word: "nein"
  none: "keine"
  unknown-subcommand: "Unbekannter Unterbefehl „{subcommand}“. Siehe /chunkkeeper help."
  no-permission: "Dazu hast du keine Berechtigung."
  usage: "Verwendung: /chunkkeeper {command} {usage}"
  not-a-number: "„{text}“ ist keine ganze Zahl."
  unknown-world: "Die Welt „{world}“ gibt es nicht oder sie ist nicht geladen."
  players-only: "Das können nur Spieler. In der Konsole nimm stattdessen „coords“."
  worldedit-missing: "WorldEdit bzw. FastAsyncWorldEdit ist nicht installiert."
  worldguard-missing: "WorldGuard ist nicht installiert."
  area-too-large: "Der Bereich hat {size} Chunks, mehr als das Limit von {limit} (max-area-chunks in der config.yml)."
  name-missing: "Gib nach --name einen Namen an, z. B. --name halloween."
  invalid-name: "„{name}“ ist kein gültiger Bereichsname. Erlaubt sind bis zu 32 Kleinbuchstaben, Ziffern, - und _."
  use-area-release: "Einen benannten Bereich gibst du mit /chunkkeeper area release <name> frei."
  area-exists: "Es gibt schon einen Bereich „{name}“. Gib ihn erst frei oder wähle einen anderen Namen."
