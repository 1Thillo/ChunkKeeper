# ChunkKeeper messages, English.
#
# Change any text here and run /chunkkeeper reload. Words in {braces} are filled in by the plugin;
# keep them, but you may move them. {count|chunk|chunks} becomes "chunk" if count is 1 and
# "chunks" otherwise. A missing key falls back to the built-in text.

general:
  yes-word: "yes"
  no-word: "no"
  none: "none"
  unknown-subcommand: "Unknown subcommand '{subcommand}'. See /chunkkeeper help."
  no-permission: "You don't have permission to do that."
  usage: "Usage: /chunkkeeper {command} {usage}"
  not-a-number: "'{text}' is not a whole number."
  unknown-world: "World '{world}' does not exist or is not loaded."
  players-only: "Only players can do that. From the console, use 'coords' instead."
  worldedit-missing: "WorldEdit or FastAsyncWorldEdit is not installed."
  worldguard-missing: "WorldGuard is not installed."
  area-too-large: "That area has {size} {size|chunk|chunks}, more than the limit of {limit} (max-area-chunks in config.yml)."
  radius-too-large: "A radius of {radius} is too large: max-area-chunks in config.yml allows {limit} chunks, which is radius {largest} at most."
  negative-radius: "The radius must be 0 or more: 0 is one chunk, 1 is 3 x 3 chunks, 2 is 5 x 5."
  name-missing: "Give a name after --name, e.g. --name halloween."
  invalid-name: "'{name}' is not a valid area name. Use up to 32 letters, digits, - and _."
  use-area-release: "To release a named area, use /chunkkeeper area release <name>."
  area-exists: "There is already an area called '{name}'. Release it first or choose another name."
  area-exists-short: "There is already an area called '{name}'."
  area-exists-other-name: "There is already an area called '{name}'. Choose another name."
  area-unknown: "There is no area called '{name}'. See /chunkkeeper area list."

# Pieces that are put into other messages
describe:
  chunk: "({x}, {z}) in '{world}'"
  rectangle: "chunks ({x1}, {z1}) to ({x2}, {z2}) in '{world}'"
  radius: "{radius} {radius|chunk|chunks} around ({x}, {z}) in '{world}'"
  worldedit: "a WorldEdit selection in '{world}'"
  worldguard: "WorldGuard region '{region}' in '{world}'"
  world-singles: "all single chunks in '{world}'"
  railway: "the railway from {x}, {y}, {z} in '{world}'"

help:
  header: "ChunkKeeper commands (aliases /keepchunks, /kc, /ck, /chk):"
  keepchunk: "Keep one chunk loaded."
  releasechunk: "Stop keeping one chunk loaded."
  keepregion: "Keep all chunks of an area loaded, optionally as a named area."
  releaseregion: "Stop keeping the single chunks of an area loaded (named areas: /chunkkeeper area release)."
  keeprail: "Keep the chunks along a railway loaded."
  releaserail: "Stop keeping the chunks along a railway loaded."
  area: "Manage named areas."
  releaseall: "Stop keeping any chunk loaded."
  list: "Show the kept chunks."
  chunkinfo: "Show whether a chunk or an area is kept loaded."
  show: "Show the kept chunks around you with particles."
  reload: "Reload config.yml, chunks.yml and the messages."
  import: "Take over the chunks from KeepChunks' data.yml or from the vanilla /forceload command."
  version: "Show the plugin and server version."
  history: "Show who changed what and when."
  backup: "List, make and restore backups of chunks.yml."

chunk:
  already-kept: "Chunk {chunk} is already kept on its own."
  kept: "Keeping chunk {chunk} loaded."
  released: "Released chunk {chunk}."
  not-kept: "Chunk {chunk} was not kept loaded."
  not-kept-on-its-own: "Chunk {chunk} is not kept on its own."
  stays-through-areas: "It stays loaded through the named area(s) {areas}. Use /chunkkeeper area release <name> to release an area."

region:
  area-created: "Created area '{name}' with {count} {count|chunk|chunks} from {source} ({new} of them {new|was|were} not kept before)."
  kept: "Keeping {added} more {added|chunk|chunks} loaded ({total} in {area}, {already} {already|was|were} kept already)."
  released: "Released {removed} of the {total} {total|chunk|chunks} in {area}."
  still-in-areas: "{count} of them {count|stays|stay} loaded because {count|it belongs|they belong} to named areas."

rail:
  following: "Following the rails from {x}, {y}, {z} in '{world}'..."
  no-rail: "There is no rail at that position. Stand on the track or give its coordinates."
  limit-hit: "Stopped after {rails} {rails|rail|rails} (rail-search-limit in config.yml). Only the part found so far is used."
  area-created: "Found {rails} {rails|rail|rails}. Created area '{name}' with {count} {count|chunk|chunks} ({new} of them {new|was|were} not kept before)."
  kept: "Found {rails} {rails|rail|rails}. Keeping {added} more {added|chunk|chunks} loaded ({total} along the track, {already} {already|was|were} kept already)."
  released: "Found {rails} {rails|rail|rails}. Released {removed} of the {total} {total|chunk|chunks} along the track."

area:
  none: "There are no named areas. Create one with /chunkkeeper keepregion ... --name <name>."
  list-header: "{count} named {count|area|areas}:"
  list-entry: "{count} {count|chunk|chunks} in '{world}'"
  info-header: "Area '{name}'"
  label-world: "World"
  label-chunks: "Chunks"
  label-source: "Made from"
  label-span: "Spans chunks"
  label-created: "Created by"
  span: "({x1}, {z1}) to ({x2}, {z2})"
  released: "Released area '{name}' ({count} {count|chunk|chunks})."
  still-kept: "{count} of its chunks {count|stays|stay} loaded because {count|it is|they are} kept on their own or by other areas."
  renamed: "Renamed area '{old}' to '{new}'."
  nothing-to-convert: "There are no single chunks in {selection}, so there is nothing to convert. No area was created."
  converted: "Converted {count} single {count|chunk|chunks} from {selection} into area '{name}'. {count|It|They} stayed loaded the whole time."
  dissolved: "Dissolved area '{name}': its {count} {count|chunk is now kept on its own|chunks are now kept on their own} ({added} of them {added|was|were} not before). Nothing was unloaded."

info:
  area-header: "Area: {area}"
  label-area-chunks: "Chunks in the area"
  label-kept: "Kept by ChunkKeeper"
  chunk-header: "Chunk {chunk}"
  label-blocks: "Blocks"
  blocks: "x {x1} to {x2}, z {z1} to {z2}"
  label-on-its-own: "Kept on its own"
  label-added: "Added on its own by"
  label-areas: "Named areas"
  label-force-loaded: "Force-loaded"
  label-loaded: "Loaded right now"
  not-force-loaded-yet: "The chunk is kept but not force-loaded yet; this fixes itself within a moment or after /chunkkeeper reload."
  forced-by-something-else: "Something else force-loads this chunk, for example the vanilla /forceload command. /chunkkeeper import forceload takes such chunks over."

list:
  nothing: "No chunks are kept loaded."
  header: "{count} {count|chunk is|chunks are} kept loaded:"
  world-entry: "{count} {count|chunk|chunks}"
  details-hint: "Details: /chunkkeeper list <world> [page]"
  no-singles-in-world: "No single chunks are kept in world '{world}'. Named areas: /chunkkeeper area list"
  no-such-page: "Page {page} does not exist. There {pages|is|are} {pages} {pages|page|pages}."
  page-header: "Kept chunks in '{world}', page {page} of {pages}:"
  chunk-label: "Chunk ({x}, {z})"
  chunk-entry: "blocks {x}, {z}"

show:
  started: "Showing the kept chunks within {radius} {radius|chunk|chunks} for {seconds} seconds: green lines are single chunks, blue lines named areas. /chunkkeeper show again turns it off."
  stopped: "No longer showing the kept chunks."
  ended: "Stopped showing the kept chunks. /chunkkeeper show shows them again."
  nothing-near: "There are no kept chunks within {radius} {radius|chunk|chunks} of you right now."
  radius-out-of-range: "The radius has to be between 0 and {largest} (show-max-radius in config.yml)."

releaseall:
  console-only: "Only the server console may do that (release-all-console-only in config.yml)."
  confirm: "This releases {chunks} single {chunks|chunk|chunks} and {areas} named {areas|area|areas}. Type /chunkkeeper releaseall confirm to do it."
  done: "Released {chunks} {chunks|chunk|chunks} and {areas} named {areas|area|areas}."

reload:
  done: "Reloaded. {chunks} single {chunks|chunk|chunks} and {areas} named {areas|area|areas} are kept loaded."

import:
  no-file: "There is no {file} to import from."
  done: "Found {found} {found|chunk|chunks} in KeepChunks' data.yml, {added} of them {added|was|were} new."
  unreadable: "{count} {count|entry|entries} could not be read; see the console."
  forceload-none: "There are no chunks force-loaded with /forceload."
  forceload-nothing: "ChunkKeeper already keeps every force-loaded chunk ({found})."
  forceload-done: "Took over {added} {added|chunk|chunks} force-loaded with /forceload; ChunkKeeper keeps {added|it|them} on its own now ({already} {already|was|were} kept already)."

version:
  plugin: "ChunkKeeper v{version}"
  server: "Server: {platform} {minecraft} ({server})"

origin:
  known: "{by}, {date}"
  unknown: "unknown (from before ChunkKeeper 1.2.0)"

# Lines in plugins/ChunkKeeper/history.log and /chunkkeeper history
history:
  header: "Changes, newest first (page {page} of {pages}):"
  empty: "Nothing has been recorded yet."
  kept-chunk: "kept chunk {chunk}"
  released-chunk: "released chunk {chunk}"
  kept-chunks: "kept {count} {count|chunk|chunks}: {area}"
  released-chunks: "released {count} {count|chunk|chunks}: {area}"
  area-created: "created area '{name}' with {count} {count|chunk|chunks} from {source}"
  area-released: "released area '{name}' ({count} {count|chunk|chunks})"
  area-renamed: "renamed area '{old}' to '{new}'"
  area-converted: "converted {count} single {count|chunk|chunks} into area '{name}'"
  area-dissolved: "dissolved area '{name}' ({count} {count|chunk|chunks})"
  released-all: "released all: {chunks} {chunks|chunk|chunks} and {areas} named {areas|area|areas}"
  imported: "imported {count} {count|chunk|chunks} from KeepChunks"
  imported-forceload: "took over {count} {count|chunk|chunks} from /forceload"
  backup-created: "made backup {name}"
  backup-restored: "restored backup {name}"

backup:
  none: "There are no backups yet. They are made before releaseall, import and restore, or with /chunkkeeper backup create."
  list-header: "{count} {count|backup|backups}, newest first:"
  contents: "{chunks} single {chunks|chunk|chunks}, {areas} named {areas|area|areas}"
  nothing-to-save: "There is no chunks.yml to back up yet."
  created: "Saved backup {name}."
  automatic: "Saved a backup first: {name} (undo with /chunkkeeper backup restore {name})."
  unknown: "There is no backup called '{name}'. See /chunkkeeper backup list."
  confirm-restore: "Backup {name} holds {contents}. Chunks that are not in it will be released. Type /chunkkeeper backup restore {name} confirm to restore it."
  restored: "Restored {name}. {chunks} single {chunks|chunk|chunks} and {areas} named {areas|area|areas} are kept loaded. The state before was saved as {previous}."
  failed: "That did not work: {error}"

worldedit:
  no-selection: "Select an area with WorldEdit first."

worldguard:
  unknown-region: "There is no WorldGuard region '{region}' in world '{world}'."
  global-region: "The global region covers the whole world and cannot be kept loaded."
