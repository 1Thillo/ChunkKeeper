name: ChunkKeeper
version: '${version}'
main: de.thillo.chunkkeeper.ChunkKeeper
api-version: '26.2'
folia-supported: true
description: Keep selected chunks loaded, even when no players are around.
author: Thillo
website: https://github.com/1Thillo/ChunkKeeper
softdepend: [WorldEdit, FastAsyncWorldEdit, WorldGuard]

commands:
  chunkkeeper:
    description: Keep chunks loaded.
    usage: /chunkkeeper help
    aliases: [keepchunks, kc, ck, chk]

permissions:
  chunkkeeper.*:
    description: All ChunkKeeper commands.
    default: op
    children:
      chunkkeeper.help: true
      chunkkeeper.version: true
      chunkkeeper.list: true
      chunkkeeper.chunkinfo: true
      chunkkeeper.reload: true
      chunkkeeper.import: true
      chunkkeeper.history: true
      chunkkeeper.keepchunk: true
      chunkkeeper.releasechunk: true
      chunkkeeper.keepregion: true
      chunkkeeper.releaseregion: true
      chunkkeeper.keeprail: true
      chunkkeeper.releaserail: true
      chunkkeeper.area: true
      chunkkeeper.releaseall: true
  chunkkeeper.help:
    default: op
  chunkkeeper.version:
    default: op
  chunkkeeper.list:
    default: op
  chunkkeeper.chunkinfo:
    default: op
  chunkkeeper.reload:
    default: op
  chunkkeeper.import:
    default: op
  chunkkeeper.history:
    default: op
  chunkkeeper.keepchunk:
    default: op
  chunkkeeper.releasechunk:
    default: op
  chunkkeeper.keepregion:
    default: op
  chunkkeeper.releaseregion:
    default: op
  chunkkeeper.keeprail:
    default: op
  chunkkeeper.releaserail:
    default: op
  chunkkeeper.area:
    default: op
  chunkkeeper.releaseall:
    default: op
