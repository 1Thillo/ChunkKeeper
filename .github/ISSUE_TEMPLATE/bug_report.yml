name: Bug report
description: Something in ChunkKeeper does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The more of the fields below you fill in, the faster it can be fixed.
        **Security problems** do not belong here; please report them privately (see the Security tab).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: "I ran /chunkkeeper keepregion worldguard spawn world and got ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands and actions, one per line, starting from a fresh server if possible.
      placeholder: |
        1. /chunkkeeper keepchunk current
        2. /chunkkeeper chunkinfo current
        3. ...
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server software
      options:
        - Paper
        - Folia
        - Purpur
        - Other (please name it below)
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste the output of `/chunkkeeper version`. It shows the ChunkKeeper and the server version.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: other-plugins
    attributes:
      label: Related plugins on the server
      description: Tick the ones that are installed.
      options:
        - label: WorldEdit
        - label: FastAsyncWorldEdit
        - label: WorldGuard
        - label: PlugMan / PlugManX
        - label: Multiverse or another world manager
        - label: EssentialsX

  - type: textarea
    id: log
    attributes:
      label: Server log
      description: |
        Errors from the console or `logs/latest.log`, including the complete stack trace down to the last "Caused by". Please remove IP addresses and other private data first.
      render: text

  - type: textarea
    id: files
    attributes:
      label: Configuration
      description: Your `plugins/ChunkKeeper/config.yml`, and the part of `chunks.yml` that matters, if the problem is about specific chunks or areas.
      render: yaml

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest ChunkKeeper release.
          required: true
        - label: I searched the existing issues and did not find this problem.
          required: true
