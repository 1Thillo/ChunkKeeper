name: Feature request
description: Suggest an idea or an improvement for ChunkKeeper.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation on your server and what is missing or cumbersome today.
      placeholder: "During events we keep a whole world loaded and have to release it by hand afterwards ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How could ChunkKeeper help?
      description: Your idea of how it could work, for example a command, an option in config.yml or a change to an existing command.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you have tried or considered, if any.

  - type: dropdown
    id: server
    attributes:
      label: Server software you would use it on
      multiple: true
      options:
        - Paper
        - Folia
        - Purpur
        - Other
