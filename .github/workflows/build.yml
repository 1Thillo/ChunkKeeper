name: Java CI with Gradle

on:
  # Every pushed branch gets a jar under Actions, so nobody needs a local build to test
  push:
    branches-ignore: [ "master" ]
  pull_request:
    branches: [ "master" ]
    # "edited" includes changing a PR's base branch, so stacked PRs get checked after retargeting
    types: [ opened, synchronize, reopened, edited ]
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build and test with Gradle
      run: |
        chmod +x ./gradlew
        ./gradlew build

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-report
        path: build/reports/tests/test
        if-no-files-found: ignore

    - name: Select main jar
      run: |
        echo "Available jars in build/libs/:"
        ls build/libs || echo "No build/libs directory"

        # the plugin jar is the one without a classifier
        MAIN_JAR=$(ls build/libs/*.jar | grep -v -- '-plain' | grep -v 'sources' | grep -v 'javadoc' | head -n 1 || true)

        if [ -z "$MAIN_JAR" ]; then
          echo "No suitable main JAR found."
          exit 1
        fi

        echo "Selected main JAR: $MAIN_JAR"
        echo "MAIN_JAR=$MAIN_JAR" >> $GITHUB_ENV

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: plugin-jar
        path: ${{ env.MAIN_JAR }}
        if-no-files-found: error


  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: plugin-jar
          path: ./build

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
