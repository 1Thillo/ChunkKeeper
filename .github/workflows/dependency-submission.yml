name: Dependency submission

# Sends the resolved Gradle dependencies to GitHub's dependency graph. Dependabot alerts can only
# warn about vulnerable libraries in a Gradle project once GitHub knows the full dependency list.
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Submit the dependency graph
      uses: gradle/actions/dependency-submission@v6
